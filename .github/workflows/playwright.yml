name: Playwright tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly: every project, all browsers
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      app_env:
        description: Environment under test
        type: choice
        options: [prod]
        default: prod
      project:
        description: Playwright project (all = every project)
        type: choice
        options: [all, api, chromium, firefox, webkit, mobile-chrome]
        default: all
      grep:
        description: Tag or title filter, e.g. @smoke or @regression (empty = everything)
        type: string
        default: ''
      log_level:
        description: Log level (debug dumps requests, responses and payloads; sensitive values stay encrypted)
        type: choice
        options: [error, warn, info, debug]
        default: info
      update_snapshots:
        description: Regenerate the Linux visual baselines (@visual, chromium) and commit them to this branch instead of testing
        type: boolean
        default: false
  # Called by the app repository after each deploy: runs the smoke suite
  repository_dispatch:
    types: [app-deployed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  APP_ENV: ${{ inputs.app_env || 'prod' }}
  LOG_LEVEL: ${{ inputs.log_level || vars.LOG_LEVEL || 'info' }}

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Dependency audit (fails on high or critical)
        run: npm audit --audit-level=high

  test:
    name: Tests (shard ${{ matrix.shard }}/4)
    needs: typecheck
    if: ${{ !inputs.update_snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.app_env || 'prod' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Select suite
        id: suite
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PROJECT: ${{ inputs.project }}
        # Free-text inputs (grep) never go through here: they are passed to the test step as quoted env values
        run: |
          case "$EVENT" in
            pull_request|repository_dispatch)
              args="--project=api --project=chromium --grep=@smoke"; browsers="chromium" ;;
            push)
              args="--project=api --project=chromium"; browsers="chromium" ;;
            schedule)
              args=""; browsers="chromium firefox webkit" ;;
            workflow_dispatch)
              args=""; browsers="chromium firefox webkit"
              case "$INPUT_PROJECT" in
                all) ;;
                api|chromium|mobile-chrome) args="--project=$INPUT_PROJECT"; browsers="chromium" ;;
                firefox|webkit) args="--project=$INPUT_PROJECT"; browsers="$INPUT_PROJECT" ;;
                *) echo "Unknown project: $INPUT_PROJECT" >&2; exit 1 ;;
              esac ;;
          esac
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "browsers=$browsers" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ steps.suite.outputs.browsers }}

      - name: Install browsers
        env:
          BROWSERS: ${{ steps.suite.outputs.browsers }}
        run: npx playwright install --with-deps $BROWSERS

      - name: Run tests
        env:
          TEST_DATA_KEY: ${{ secrets.TEST_DATA_KEY }}
          # Picks this shard's block of pool accounts (see fixtures/auth.ts)
          SHARD_INDEX: ${{ matrix.shard }}
          SUITE_ARGS: ${{ steps.suite.outputs.args }}
          INPUT_GREP: ${{ inputs.grep }}
        # SUITE_ARGS is built from fixed values only and is split on purpose; the grep text stays one quoted argument
        run: npx playwright test $SUITE_ARGS ${INPUT_GREP:+--grep "$INPUT_GREP"} --shard="$SHARD_INDEX/4" --reporter=blob,list

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  cleanup:
    name: Clean up leftover test data
    needs: test
    # Also after failed or cancelled runs; only events older than 30 minutes are deleted, so other runs keep theirs
    if: ${{ always() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.app_env || 'prod' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Delete test events left in the pool accounts
        env:
          TEST_DATA_KEY: ${{ secrets.TEST_DATA_KEY }}
        run: npm run sandbox:cleanup

  update-snapshots:
    name: Update Linux visual baselines
    needs: typecheck
    if: ${{ inputs.update_snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.app_env || 'prod' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Regenerate baselines
        env:
          TEST_DATA_KEY: ${{ secrets.TEST_DATA_KEY }}
        # "changed" rewrites only screenshots that differ; the hand-tuned *.aria.yml baselines (regexes) match, so they are kept
        run: npx playwright test --project=chromium --grep=@visual --update-snapshots=changed --workers=1

      - name: Commit changed baselines
        run: |
          git add -- 'tests/**/*-linux.png'
          if git diff --cached --quiet; then
            echo "Baselines are already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "test(visual): update Linux baselines"
          git push

  report:
    name: Merge reports
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML and JUnit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/results.xml
        run: npx playwright merge-reports --reporter=html,junit ./all-blob-reports

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results/results.xml
          retention-days: 14

      - name: Upload report for GitHub Pages
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: playwright-report

  publish:
    name: Publish report
    needs: report
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
